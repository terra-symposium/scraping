name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      security-events: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir config install --frozen-lockfile
      - name: Run full-scope Quality
        run: pnpm run quality:all
      - name: Require committed Quality fixes
        run: git diff --exit-code
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm run test
